name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # nécessaire pour publier la release sur un tag

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lato est indispensable : la CSS n'utilise aucune webfont et les
      # métriques de la police déterminent le taux de remplissage des pages.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-lato fonts-dejavu-core \
            poppler-utils
          fc-cache -f
          fc-list | grep -qi lato || { echo "Lato absente"; exit 1; }

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Rendu des fiches
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: ./build/render.sh

      - name: Assemblage du recueil
        run: ./build/package.sh


      - uses: actions/upload-artifact@v4
        with:
          name: fiches-pdf
          path: out/*.pdf
          retention-days: 30

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/FICHES-PMG-A5.pdf
