name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # nécessaire pour publier les releases

# Un seul run à la fois par ref : sans cela, deux pushes rapprochés peuvent
# finir dans le désordre et la pré-release « courant » pointer sur l'ancien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lato est indispensable : la CSS n'utilise aucune webfont et les
      # métriques de la police déterminent le taux de remplissage des pages.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-lato fonts-dejavu-core \
            poppler-utils
          fc-cache -f
          fc-list | grep -qi lato || { echo "Lato absente"; exit 1; }

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Rendu des fiches
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: ./build/render.sh

      - name: Assemblage du recueil
        run: ./build/package.sh


      - uses: actions/upload-artifact@v4
        with:
          name: fiches-pdf
          path: out/*.pdf
          retention-days: 30

      # Chaque push sur main remplace la pré-release « courant » : un lien
      # stable vers le PDF du dernier commit, sans attendre un tag v*.
      # Le tag est recréé par l'API avec GITHUB_TOKEN, ce qui ne relance
      # aucun workflow (et « courant » ne correspond pas à v*).
      - name: Publication de la version courante
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete courant --cleanup-tag --yes || true
          gh release create courant out/FICHES-PMG-A5.pdf \
            --target "$GITHUB_SHA" --prerelease \
            --title "Current build (main)" \
            --notes "Rebuilt on every push to main — commit ${GITHUB_SHA::7}, $(date -u +%F). Dated releases (v…) are the reference editions."

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/FICHES-PMG-A5.pdf
